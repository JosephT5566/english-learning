name: Smoke API candidate

on:
  workflow_dispatch:
    inputs:
      google_id_token:
        description: Fresh Google ID token for an allowlisted account (short-lived; input is not a GitHub secret)
        required: true
        type: string
      confirm_review_write:
        description: Submit and replay one real due-card review
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-api-release
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify tagged zero-traffic candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      API_SERVICE: ${{ vars.API_SERVICE }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_GITHUB_SERVICE_ACCOUNT: ${{ vars.GCP_GITHUB_SERVICE_ACCOUNT }}

    steps:
      - name: Mask supplied token and validate configuration
        shell: bash
        env:
          GOOGLE_ID_TOKEN: ${{ inputs.google_id_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GOOGLE_ID_TOKEN}"
          if [[ -z "${GOOGLE_ID_TOKEN}" ]]; then
            echo "A fresh Google ID token is required." >&2
            exit 1
          fi
          for name in API_SERVICE GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_GITHUB_SERVICE_ACCOUNT; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub production environment variable: ${name}." >&2
              exit 1
            fi
          done

      - name: Checkout smoke script
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_GITHUB_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve tagged candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          service_file="${RUNNER_TEMP}/service.json"
          gcloud run services describe "${API_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format=json > "${service_file}"
          candidate="$(python3 -c '
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              service = json.load(source)
          tagged = [item for item in service.get("status", {}).get("traffic", []) if item.get("tag") == "candidate"]
          if len(tagged) != 1 or not tagged[0].get("url") or not tagged[0].get("revisionName"):
              raise SystemExit("Expected one tagged candidate with a URL and revision")
          candidate = tagged[0]
          if any(item.get("revisionName") == candidate["revisionName"] and item.get("percent", 0) > 0
                 for item in service["status"]["traffic"]):
              raise SystemExit("Candidate already receives production traffic")
          print(candidate["revisionName"] + "\t" + candidate["url"])
          ' "${service_file}")"
          IFS=$'\t' read -r revision url <<< "${candidate}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Run authenticated smoke
        shell: bash
        env:
          GOOGLE_ID_TOKEN: ${{ inputs.google_id_token }}
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          CONFIRM_REVIEW_WRITE: ${{ inputs.confirm_review_write && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          bash deploy/cloud-run/smoke.sh "${CANDIDATE_URL}"

      - name: Record candidate result
        shell: bash
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          CONFIRM_REVIEW_WRITE: ${{ inputs.confirm_review_write && 'yes' || 'no' }}
        run: |
          {
            echo "## Authenticated candidate smoke passed"
            echo
            echo "- Revision: \`${REVISION}\`"
            echo "- Candidate URL: ${CANDIDATE_URL}"
            echo "- Owned read: passed"
            echo "- Controlled review write and replay: ${CONFIRM_REVIEW_WRITE}"
          } >> "${GITHUB_STEP_SUMMARY}"

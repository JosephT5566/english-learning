name: Smoke API candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-api-release
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify tagged zero-traffic candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      API_SERVICE: ${{ vars.API_SERVICE }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_GITHUB_SERVICE_ACCOUNT: ${{ vars.GCP_GITHUB_SERVICE_ACCOUNT }}
      RELEASE_SMOKE_AUDIENCE: ${{ vars.RELEASE_SMOKE_AUDIENCE }}
      RELEASE_SMOKE_SUBJECT: ${{ vars.RELEASE_SMOKE_SUBJECT }}
      RELEASE_SMOKE_EMAIL: ${{ vars.RELEASE_SMOKE_EMAIL }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in API_SERVICE GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_GITHUB_SERVICE_ACCOUNT RELEASE_SMOKE_AUDIENCE RELEASE_SMOKE_SUBJECT RELEASE_SMOKE_EMAIL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub production environment variable: ${name}." >&2
              exit 1
            fi
          done

      - name: Checkout smoke script
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_GITHUB_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve tagged candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          service_file="${RUNNER_TEMP}/service.json"
          gcloud run services describe "${API_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format=json > "${service_file}"
          candidate="$(python3 -c '
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              service = json.load(source)
          tagged = [item for item in service.get("status", {}).get("traffic", []) if item.get("tag") == "candidate"]
          if len(tagged) != 1 or not tagged[0].get("url") or not tagged[0].get("revisionName"):
              raise SystemExit("Expected one tagged candidate with a URL and revision")
          candidate = tagged[0]
          if any(item.get("revisionName") == candidate["revisionName"] and item.get("percent", 0) > 0
                 for item in service["status"]["traffic"]):
              raise SystemExit("Candidate already receives production traffic")
          print(candidate["revisionName"] + "\t" + candidate["url"])
          ' "${service_file}")"
          IFS=$'\t' read -r revision url <<< "${candidate}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate smoke principal with OIDC
        id: smoke-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.RELEASE_SMOKE_EMAIL }}
          token_format: id_token
          id_token_audience: ${{ vars.RELEASE_SMOKE_AUDIENCE }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Run authenticated smoke
        shell: bash
        env:
          RELEASE_SMOKE_ID_TOKEN: ${{ steps.smoke-auth.outputs.id_token }}
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          set -euo pipefail
          set +x
          echo "::add-mask::${RELEASE_SMOKE_ID_TOKEN}"
          bash deploy/cloud-run/smoke.sh "${CANDIDATE_URL}"

      - name: Record candidate result
        shell: bash
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          {
            echo "## Machine-identity candidate smoke passed"
            echo
            echo "- Revision: \`${REVISION}\`"
            echo "- Google bearer rejected; exchange and owned read passed"
            echo "- Synthetic card reviewed, replayed identically, and archived"
            echo "- Refresh rotation and logout verified"
          } >> "${GITHUB_STEP_SUMMARY}"

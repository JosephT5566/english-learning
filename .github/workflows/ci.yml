name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    # SvelteKit generates named exports for $env/static/public only when the
    # variables exist. Safe placeholders keep clean-runner checks deterministic.
    env:
      PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      PUBLIC_GOOGLE_AUTH_CLIENT_ID: ci-google-client-id
      PUBLIC_EMAIL_WHITE_LIST: ci-user@example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv for API contract generation
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: npm ci

      - name: Synchronize API contract dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Check generated API contract
        run: npm run api:check

      - name: Build frontend
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
        run: npm run build

      - name: Test frontend contracts and review state
        run: npm run test:frontend

      - name: Check frontend types and Svelte contracts
        run: npm run check

      - name: Test critical review browser flows
        run: npm run test:browser

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: english_learning
          POSTGRES_USER: english_learning
          POSTGRES_PASSWORD: english_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U english_learning -d english_learning"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://english_learning:english_learning@localhost:5432/english_learning
      RUN_POSTGRES_INTEGRATION_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test with PostgreSQL
        run: uv run pytest -q

      - name: Build locked API container
        run: docker build --tag english-learning-api:verify .

      - name: Verify API container runtime contract
        run: bash scripts/verify_container.sh english-learning-api:verify

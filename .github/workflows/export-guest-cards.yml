name: Export guest cards

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-cards-export
  cancel-in-progress: false

jobs:
  export_guest_cards:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: guest-cards-export
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Authenticate dedicated export identity
        id: export_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GUEST_EXPORT_EMAIL }}
          token_format: id_token
          id_token_audience: ${{ vars.GUEST_EXPORT_AUDIENCE }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Export validated public snapshot
        env:
          GUEST_EXPORT_API_ORIGIN: ${{ vars.GUEST_EXPORT_API_ORIGIN }}
          GUEST_EXPORT_TOKEN: ${{ steps.export_auth.outputs.id_token }}
        run: node scripts/export-guest-cards.mjs exported-guest/cards.json
      - name: Transfer sanitized snapshot only
        uses: actions/upload-artifact@v4
        with:
          name: guest-cards
          path: exported-guest/cards.json
          if-no-files-found: error
          retention-days: 1

  propose_snapshot:
    if: github.ref == 'refs/heads/main'
    needs: export_guest_cards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Download same-run sanitized snapshot
        uses: actions/download-artifact@v4
        with:
          name: guest-cards
          path: static/guest
      - name: Validate and format proposed guest snapshot
        run: |
          node scripts/validate-guest-snapshot.mjs static/guest/cards.json
          npx prettier --write static/guest/cards.json
          node scripts/validate-guest-snapshot.mjs static/guest/cards.json
      - name: Propose public snapshot update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/guest-cards-snapshot
          base: main
          add-paths: static/guest/cards.json
          commit-message: "Update public guest cards snapshot"
          title: "Update public guest cards snapshot"
          body: |
            Update the approved public guest snapshot from the manually requested export.

            Review the public card content and CI results before merging. After merging,
            manually run Deploy to GitHub Pages to publish the committed snapshot.
